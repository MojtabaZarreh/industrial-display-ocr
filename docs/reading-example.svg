<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="378" viewBox="0 0 1280 378" role="img" aria-labelledby="title desc">
<title id="title">Zero-aware delivery policy example</title><desc id="desc">Independent cases with reference readings 120, 124, 119: normal 120 is accepted, spike 819 uses the preceding accepted 119, zero is accepted, and recovery 121 is accepted.</desc><rect width="1280" height="378" rx="20" fill="#0d1b2c"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="36" y="47" fill="#f2f7ff" font-size="27" font-weight="700">Keep stops visible. Review spikes.</text><text x="36" y="77" fill="#a5bbd2" font-size="16">Independent cases · reference values: 120, 124, 119 · latest accepted value before spike: 119</text>
<rect x="36" y="104" width="290" height="218" rx="12" fill="#152b41" stroke="#2c465e"/><text x="54" y="135" fill="#74c7fc" font-size="14" font-weight="700" letter-spacing="2">NORMAL</text><text x="54" y="167" fill="#a5bbd2" font-size="13">OBSERVED</text><text x="54" y="208" fill="#f3f7ff" font-family="monospace" font-size="40">120</text><path d="M151 193h30m-7-6 7 6-7 6" fill="none" stroke="#7998b5" stroke-width="2"/><text x="200" y="167" fill="#a5bbd2" font-size="13">DELIVERED</text><text x="200" y="208" fill="#74c7fc" font-family="monospace" font-size="40">120</text><path d="M54 236h254" stroke="#2c465e"/><text x="54" y="265" fill="#c4d3e3" font-size="14">Within the running range</text><text x="54" y="291" fill="#90a8c0" font-size="13">Current observation timestamp</text><rect x="342" y="104" width="290" height="218" rx="12" fill="#152b41" stroke="#2c465e"/><text x="360" y="135" fill="#ffcc76" font-size="14" font-weight="700" letter-spacing="2">SPIKE</text><text x="360" y="167" fill="#a5bbd2" font-size="13">OBSERVED</text><text x="360" y="208" fill="#f3f7ff" font-family="monospace" font-size="40">819</text><path d="M457 193h30m-7-6 7 6-7 6" fill="none" stroke="#7998b5" stroke-width="2"/><text x="506" y="167" fill="#a5bbd2" font-size="13">DELIVERED</text><text x="506" y="208" fill="#ffcc76" font-family="monospace" font-size="40">119</text><path d="M360 236h254" stroke="#2c465e"/><text x="360" y="265" fill="#c4d3e3" font-size="14">Use previous accepted value</text><text x="360" y="291" fill="#90a8c0" font-size="13">Current observation timestamp</text><rect x="648" y="104" width="290" height="218" rx="12" fill="#152b41" stroke="#2c465e"/><text x="666" y="135" fill="#64dfb2" font-size="14" font-weight="700" letter-spacing="2">STOP</text><text x="666" y="167" fill="#a5bbd2" font-size="13">OBSERVED</text><text x="666" y="208" fill="#f3f7ff" font-family="monospace" font-size="40">0</text><path d="M763 193h30m-7-6 7 6-7 6" fill="none" stroke="#7998b5" stroke-width="2"/><text x="812" y="167" fill="#a5bbd2" font-size="13">DELIVERED</text><text x="812" y="208" fill="#64dfb2" font-family="monospace" font-size="40">0</text><path d="M666 236h254" stroke="#2c465e"/><text x="666" y="265" fill="#c4d3e3" font-size="14">Accept zero; keep baseline</text><text x="666" y="291" fill="#90a8c0" font-size="13">Current observation timestamp</text><rect x="954" y="104" width="290" height="218" rx="12" fill="#152b41" stroke="#2c465e"/><text x="972" y="135" fill="#74c7fc" font-size="14" font-weight="700" letter-spacing="2">RECOVERY</text><text x="972" y="167" fill="#a5bbd2" font-size="13">OBSERVED</text><text x="972" y="208" fill="#f3f7ff" font-family="monospace" font-size="40">121</text><path d="M1069 193h30m-7-6 7 6-7 6" fill="none" stroke="#7998b5" stroke-width="2"/><text x="1118" y="167" fill="#a5bbd2" font-size="13">DELIVERED</text><text x="1118" y="208" fill="#74c7fc" font-family="monospace" font-size="40">121</text><path d="M972 236h254" stroke="#2c465e"/><text x="972" y="265" fill="#c4d3e3" font-size="14">Accept return to running range</text><text x="972" y="291" fill="#90a8c0" font-size="13">Current observation timestamp</text><text x="36" y="351" fill="#9fb6cc" font-size="14">All values first pass OCR validation. Raw anomalies remain in history. Camera capture failures use a separate −2 marker.</text></g></svg>
