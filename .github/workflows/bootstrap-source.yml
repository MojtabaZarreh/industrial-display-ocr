name: Import standalone source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Import verified source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-files --error-unmatch notebooks/PP_OCRv6_medium_3datasets.ipynb >/dev/null 2>&1; then
            echo "Standalone source is already imported."
            exit 0
          fi
          gh release download source-transfer --repo "$GITHUB_REPOSITORY" --pattern digit-ocr-yourcompany-source.zip --dir "$RUNNER_TEMP"
          echo "58c213a76a70ba567e8693d9834ea50dad826ecd6064ad37645da93ed0ed4541  $RUNNER_TEMP/digit-ocr-yourcompany-source.zip" | sha256sum --check
          python -c "import os, zipfile; zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'], 'digit-ocr-yourcompany-source.zip')).extractall('.')"
          git config user.name "MojtabaZarreh"
          git config user.email "71370569+MojtabaZarreh@users.noreply.github.com"
          git add --all
          git reset -- .github/workflows/tests.yml
          git add --force services/weights/
          git commit -m "Import sanitized application, model weights and training notebook"
          git push origin HEAD:main
